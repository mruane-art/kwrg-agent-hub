<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%23C8102E%22/><text x=%2216%22 y=%2222%22 font-family=%22Arial%22 font-weight=%22700%22 font-size=%2214%22 fill=%22white%22 text-anchor=%22middle%22>KW</text></svg>">
<title>KWRG Agent Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: fixed ink sidebar (drawer on phones) + scrolling work surface; red only for brand moments and primary actions */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --sunken:#EBECEF; --line:#DADCE1; --fg:#17181C; --muted:#5D616B;
  --red:#B5121B; --red-ink:#FFFFFF; --red-soft:#FBE9EA; --ink:#14161B; --ink-2:#1E2129; --ink-fg:#E9EAEE; --ink-muted:#9A9EAA;
  --ok:#1C7A46; --ok-soft:#E3F3EA; --warn:#9A5B00; --warn-soft:#FDF1DC; --bad:#B42318;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif; --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px; --shadow:0 1px 2px rgba(20,22,27,.06),0 4px 14px rgba(20,22,27,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101116; --surface:#181A21; --sunken:#1F222A; --line:#2C3039; --fg:#ECEDF1; --muted:#A0A4AF;
  --red:#E0323C; --red-ink:#FFFFFF; --red-soft:#3A1A1D; --ink:#0B0C10; --ink-2:#171920; --ink-fg:#E9EAEE; --ink-muted:#8F94A0;
  --ok:#4CC484; --ok-soft:#163324; --warn:#F0B34E; --warn-soft:#3A2C12; --bad:#FF7A6E; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101116; --surface:#181A21; --sunken:#1F222A; --line:#2C3039; --fg:#ECEDF1; --muted:#A0A4AF;
  --red:#E0323C; --red-ink:#FFFFFF; --red-soft:#3A1A1D; --ink:#0B0C10; --ink-2:#171920; --ink-fg:#E9EAEE; --ink-muted:#8F94A0;
  --ok:#4CC484; --ok-soft:#163324; --warn:#F0B34E; --warn-soft:#3A2C12; --bad:#FF7A6E; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
/* sidebar */
.side{background:var(--ink);color:var(--ink-fg);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding-block:18px 14px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:12px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.mark{width:34px;height:34px;border-radius:7px;background:var(--red);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:13px;letter-spacing:.02em;color:#fff}
.brand b{font-family:var(--display);font-stretch:85%;font-weight:800;font-size:17px;letter-spacing:.01em;line-height:1.05;display:block}
.brand small{color:var(--ink-muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted);padding:14px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;text-decoration:none;color:var(--ink-fg);font-size:14px}
.nav a svg{width:17px;height:17px;flex:none;opacity:.75}
.nav a:hover{background:var(--ink-2)}
.nav a[aria-current="page"]{background:var(--red);color:#fff}
.nav a[aria-current="page"] svg{opacity:1}
.side-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid #262A33;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-muted)}
.avatar{width:28px;height:28px;border-radius:50%;background:#2A2E38;color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:linear-gradient(90deg,var(--red),transparent 70%)}
.top h1{margin:0;font-family:var(--display);font-stretch:90%;font-weight:800;font-size:18px}
.menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:8px;width:38px;height:38px;cursor:pointer}
.state-pick{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-size:12.5px;font-weight:600}
.state-pick button{border:0;background:none;padding:6px 12px;cursor:pointer;color:var(--muted)}
.state-pick button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
main{padding-block:26px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
/* type */
.ph{display:flex;flex-direction:column;gap:4px}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--red);font-weight:700}
h2.pt{margin:0;font-family:var(--display);font-stretch:88%;font-weight:850;font-size:clamp(28px,4vw,38px);line-height:1.05;text-wrap:balance}
.lede{margin:0;color:var(--muted);max-width:62ch}
h3.st{margin:0 0 12px;font-family:var(--display);font-stretch:92%;font-weight:750;font-size:19px;text-wrap:balance}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.todo{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:2px 8px;white-space:nowrap}
.pill{display:inline-flex;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 8px;background:var(--sunken);color:var(--muted)}
.pill.pa{background:#E7EEFB;color:#1F4E9E}.pill.nj{background:#E9F5EF;color:#1C6B43}
:root[data-theme="dark"] .pill.pa{background:#1B2A45;color:#9CBBF2}:root[data-theme="dark"] .pill.nj{background:#14301F;color:#86D3A8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.pa{background:#1B2A45;color:#9CBBF2}:root:not([data-theme="light"]) .pill.nj{background:#14301F;color:#86D3A8}}
.note{font-size:13px;color:var(--muted)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px;color:var(--muted);text-align:center}
/* hero */
.hero{border-radius:14px;padding:28px;color:#fff;background:radial-gradient(120% 140% at 0% 0%,#C8161F 0%,#8E0E19 46%,#1A1B22 100%);display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between;position:relative;overflow:hidden}
.hero::after{content:"KWRG";position:absolute;right:-10px;bottom:-34px;font-family:var(--display);font-weight:900;font-stretch:125%;font-size:140px;letter-spacing:-.02em;color:rgba(255,255,255,.06);pointer-events:none}
.hero h2{margin:0;font-family:var(--display);font-stretch:88%;font-weight:850;font-size:clamp(28px,4.4vw,42px);line-height:1.02}
.hero p{margin:6px 0 0;color:rgba(255,255,255,.82);max-width:48ch}
.hero .btn{background:#fff;color:#17181C;border-color:#fff;position:relative;z-index:1}
.hero .offices{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.hero .offices span{font-size:12px;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:3px 10px;color:rgba(255,255,255,.9)}
/* quick links */
.ql{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.ql a{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 10px;text-decoration:none;text-align:center;font-weight:600;font-size:13.5px;transition:border-color .15s,transform .15s}
.ql a:hover{border-color:var(--red);transform:translateY(-1px)}
.ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--red-soft);color:var(--red)}
.ico.alt{background:var(--sunken);color:var(--fg)}
.ico svg{width:20px;height:20px}
/* events */
.ev{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;padding:16px}
.date{border:1px solid var(--line);border-radius:8px;text-align:center;padding:6px 0;height:max-content;background:var(--sunken)}
.date small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--red)}
.date b{font-family:var(--display);font-size:24px;font-weight:800;line-height:1}
.ev h4{margin:0 0 4px;font-size:15.5px;text-wrap:balance}
.ev .meta{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.ev p{margin:8px 0 0;font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
/* forms */
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.in{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.in:focus-within{border-color:var(--red)}
.in span{padding:0 0 0 10px;color:var(--muted);font-size:14px}
.in span.suf{padding:0 10px 0 0}
.in input,.in select,input.plain,select.plain,textarea.plain{border:0;background:none;padding:9px 10px;width:100%;min-width:0;outline:none;font-size:14.5px;color:var(--fg)}
input.plain,select.plain,textarea.plain{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
input.plain:focus,select.plain:focus,textarea.plain:focus{border-color:var(--red)}
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
/* stats */
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{padding:14px 16px}
.stat small{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat b{display:block;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:22px;font-weight:600;margin-top:4px}
.stat.hot{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.stat.hot small{color:var(--ink-muted)}
.stat.hot b{font-family:var(--display);font-size:40px;font-weight:850}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--red)}
/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.r,th.r{text-align:right}
/* budget rows */
.brow{display:grid;grid-template-columns:minmax(0,1fr) 120px 112px 64px 96px 58px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.brow .code{font-family:var(--mono);font-size:12px;color:var(--muted);margin-right:8px}
.brow .lbl{font-size:14px;min-width:0}
.brow .tot{text-align:right;font-family:var(--mono);font-size:13px}
.brow .acts{display:flex;gap:2px;justify-content:flex-end}
.iconbtn{background:none;border:0;cursor:pointer;color:var(--muted);padding:4px;border-radius:6px;display:grid;place-items:center}
.iconbtn:hover{color:var(--fg);background:var(--sunken)}
.iconbtn svg{width:16px;height:16px}
.iconbtn.on{color:var(--red)}
.bhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;padding:16px 18px;border-bottom:1px solid var(--line)}
.bhead .k{font-family:var(--mono);font-size:12px;color:var(--red);letter-spacing:.06em}
.bhead h3{margin:2px 0 0;font-family:var(--display);font-stretch:92%;font-size:20px}
.bbody{padding:4px 18px 14px}
/* partners */
.pc{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px;cursor:pointer;text-align:center;border:1px solid var(--line);background:var(--surface);border-radius:var(--r)}
.pc[aria-expanded="true"]{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.plogo{width:100%;aspect-ratio:16/9;max-width:100%;border-radius:8px;background:var(--sunken);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;color:var(--muted)}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.copy{background:none;border:1px solid var(--line);border-radius:6px;font-size:11.5px;padding:1px 7px;cursor:pointer;color:var(--muted);margin-left:6px}
/* list items */
.li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);text-decoration:none}
.li:last-child{border-bottom:0}
a.li:hover{background:var(--sunken)}
.li .t{min-width:0;font-size:14px}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px;max-height:56vh;overflow-y:auto;padding:16px}
.msg{max-width:78%;padding:10px 14px;border-radius:12px;font-size:14.5px;white-space:pre-wrap}
.msg.ai{background:var(--sunken);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--red);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg.coach{background:var(--ok-soft);align-self:stretch;max-width:100%;border-left:3px solid var(--ok)}
.msg .who{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-bottom:2px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.save-state{font-size:12.5px;color:var(--muted)}
.bar{height:10px;border-radius:999px;background:var(--sunken);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.pgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));align-items:start}
.pcard{display:flex;flex-direction:column;overflow:hidden}
.lic{margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:12px;background:var(--red-soft);border:2px solid var(--red)}
.lic>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.lic-k{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
.lic-v{font-family:var(--display);font-size:30px;font-weight:900;line-height:1.05;letter-spacing:.02em;color:var(--fg)}
.ev.has-flyer{grid-column:1/-1;display:grid;grid-template-columns:200px auto minmax(0,1fr);gap:18px;align-items:start}
.ev-flyer{position:relative;display:block;border-radius:10px;overflow:hidden;box-shadow:0 6px 16px -6px rgba(0,0,0,.35);transition:transform .2s}
.ev-flyer:hover{transform:translateY(-3px) rotate(-1deg)}
.ev-flyer img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
.ev-flyer span{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);white-space:nowrap;background:#111;color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
@media (max-width:640px){.ev.has-flyer{grid-template-columns:auto minmax(0,1fr)}.ev.has-flyer .ev-flyer{grid-column:1/-1;max-width:260px}}
.calbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.calnav{display:flex;align-items:center;gap:6px}.calnav h3{margin:0 0 0 4px;font-family:var(--display);font-size:22px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.calcats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.ccat{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--fg)}
.ccat i{width:10px;height:10px;border-radius:3px;background:var(--ec)}
.ccat[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.cmonth{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.cdow{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:1px solid var(--line);background:var(--sunken)}
.cday{min-height:104px;padding:4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0}
.cday:nth-child(7n){border-right:0}.cday.out{background:var(--sunken)}.cday.out .cdn{opacity:.45}
.cdn{font-size:12.5px;font-weight:600;padding:2px 4px;align-self:flex-start;border-radius:999px}
.cday.now .cdn{background:var(--red);color:#fff;padding:2px 7px}
.cev{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--ec);background:color-mix(in srgb,var(--ec) 14%,transparent);color:var(--fg);border-radius:4px;padding:2px 5px;font:inherit;font-size:11.5px;line-height:1.3;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cev:hover{background:color-mix(in srgb,var(--ec) 26%,transparent)}
.clist{display:flex;flex-direction:column;gap:10px}
.cld{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:start}
.cldate{display:flex;flex-direction:column;align-items:center;padding:6px 0;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.cldate b{font-family:var(--display);font-size:24px;line-height:1}.cldate span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.cldate.now{background:var(--red);border-color:var(--red);color:#fff}.cldate.now span{color:#fff}
.clev{display:flex;flex-direction:column;gap:6px}
.clrow{display:flex;gap:10px;align-items:stretch;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font:inherit;color:inherit;cursor:pointer}
.clrow i{width:4px;border-radius:4px;background:var(--ec);flex:none}.clrow>span{display:flex;flex-direction:column;gap:2px;min-width:0}
.clrow:hover{border-color:var(--ec)}
.calpop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:70;padding:16px}
.calpop[hidden]{display:none}

function copyText(txt,btn){ try{ navigator.clipboard.writeText(txt).then(()=>toast("Copied"),()=>sel(btn)); }catch(e){ sel(btn); } }

/* per-agent private storage: db (data/users/<id>/<key>) with browser fallback */
const store = {
  cache:{}, timers:{},
  path(k){ return P.uid ? `data/users/${P.uid}/${k}` : null; },
  async load(k){
    if(this.cache[k]) return this.cache[k];
    let v=null;
    if(P.db && this.path(k)){
      try{ const s=await withTimeout(P.db.doc(this.path(k)).get(),10000); if(s.exists){ v=JSON.parse(s.data().json||"null"); } }catch(e){}
    }
    if(v==null){ try{ v=JSON.parse(localStorage.getItem("kwrg."+k)||"null"); }catch(e){} }
    if(P.ready) this.cache[k]=v; return v;
  },
  save(k,v,cb){
    this.cache[k]=v;
    clearTimeout(this.timers[k]);
    this.timers[k]=setTimeout(async()=>{
      let where="device";
      try{ localStorage.setItem("kwrg."+k,JSON.stringify(v)); }catch(e){}
      if(P.db && this.path(k)){
        try{ await P.db.doc(this.path(k)).set({json:JSON.stringify(v),updated:new Date().toISOString()}); where="account"; }catch(e){ where="device"; }
      }
      cb && cb(where);
    },700);
  }
};
function withTimeout(p,ms){ return Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error("timeout")),ms))]); }
function savedMsg(el){ return where=>{ if(el) el.textContent = where==="account" ? "Saved to your account · private to you" : "Saved on this device"; }; }

const GOAL_DEF = {
  investment:[["home1","1st Home"],["home2","2nd Home"],["invest","Investment Property"],["college","College Planning"],["biz2","2nd Business"],["foundation","Foundation"],["retire","Retirement"]],
  debt:[["cc","Credit Card"],["auto","Auto Loan"],["homeLoan","Home Loan"],["collegeLoan","College Loan"],["otherDebt","Other Debt"]],
  income:[["flip","Profit Flip"],["spouse","Spouse / Partner Income"],["profitShare","KW Profit Share"],["outside","Other Outside Income"]]
};
const GOAL_DEFAULT = {monthly:"",avgComm:"9000",fallthrough:"10",nogo:"20",convPerClient:"30",vacation:"4",days:"5"};
function goalCalc(g){
  const monthly=nf(g.monthly), yearly=monthly*12, reserves=monthly*3, lifestyle=yearly+reserves;
  const sum=a=>a.reduce((s,[k])=>s+nf(g[k]),0);
  const inv=sum(GOAL_DEF.investment), debt=sum(GOAL_DEF.debt), add=sum(GOAL_DEF.income);
  const total=Math.max(0,lifestyle+inv+debt-add), uplift=total*.27, income=total+uplift;
  const comm=nf(g.avgComm), ft=nf(g.fallthrough)/100, ng=nf(g.nogo)/100, cpc=nf(g.convPerClient);
  const closings = comm>0? income/comm : 0;
  const contracts = closings/(1-Math.min(ft,.95));
  const clients = contracts/(1-Math.min(ng,.95));
  const convYear = clients*cpc;
  const weeks = Math.max(1,52-nf(g.vacation));
  const convWeek = convYear/weeks;
  const convDay = convWeek/Math.max(1,nf(g.days));
  return {yearly,reserves,lifestyle,inv,debt,add,total,uplift,income,closings,contracts,clients,convYear,convWeek,convDay,contactsQ:convYear/4};
}

  {k:"1000", h:"Build the machine.", t:"Business Expenses", lines:["Payroll Gross","Employer Payroll Tax","Conference / Convention Travel","Advertising & Marketing","Signs & Riders","Business Cards / Printing","MLS Fees","Supra / Lockbox Fees","Business Insurance / Workers' Comp","Office Rent / Coworking Space","KW Office Charges","Payroll / Bookkeeping Software","KW Cap","KW Royalty","Board of Realtors / Association Dues","Software & Recurring Business Subscriptions","Website / Domain / Hosting","AI / Technology Tools","Lead Generation / Purchased Leads","Photography / Video / Listing Media","Client Gifts / Closing Gifts","Client Events / Appreciation Events","Professional Development / Coaching","Books / Courses / Training","Airfare / Hotels / Business Travel","Business Meals","Vehicle / Business Mileage","Parking / Tolls — Business","Accounting / CPA / Tax Preparation","Legal / Professional Fees","Office Supplies","Computer / Phone / Equipment","Postage / Shipping / Mailing","Transaction Coordinator / Admin Support","Referral Fees Paid","Charitable / Community Sponsorships","Bank / Credit Card / Merchant Fees","Business Phone / Internet","Other Recurring Business Expenses","Miscellaneous Business Expenses"]},
  {k:"2000", h:"Enjoy what the machine creates.", t:"Family & Life Expenses", lines:["Primary Home PITI","Rental #1 PITI","Rental Condo Fee","Rental Sewer","Primary Home Sewer","Car Insurance","Cell Phones","Child Care","Child Sports & Activities","Car Maintenance","Car Payment #1","Car Payment #2","Miscellaneous","Cable","Electric","Water","Gas — Car","Yard Care","Gas — Utility","Supermarket / Groceries","Student Loans","Entertainment","Dry Cleaning","Take Out / Dine Out","Gym","Recurring Subscriptions — streaming, apps","Amazon Prime","Home Repair / Maintenance","Daily Coffee / Drinks","Gifts","Life Insurance","Health Insurance","Vacation","Minimum Debt Service","Alimony","Child Support","Family Medical Care — prescriptions, co-pays","Religious Donations","Homeowners Association (HOA)","Education Expenses","Pet Care","Legal Fees","Auto Registration / Tolls / Parking","Clothing & Shoes","Personal Care / Grooming","Household Supplies","Furniture / Appliances","Technology / Electronics"]},
  {k:"3000", h:"Make tomorrow better than today.", t:"Savings, Investing & Wealth Building", lines:["Emergency Fund Contribution","Retirement Contributions — 401(k) / IRA","Brokerage / Investment Account","529 / College Savings","General Savings","Vacation / Travel Savings Fund","Home Improvement / Capital Project Fund","Vehicle Replacement Fund","Rental Property Reserve / CapEx","Future Real Estate Purchase Fund","Major Purchase Fund","Additional Principal — Primary Mortgage","Additional Principal — Rental Mortgage(s)","Additional Debt Paydown","Other Investments"]}
];
const ESSENTIAL = new Set(["2001","2006","2007","2008","2011","2012","2015","2016","2017","2019","2020","2021","2031","2032","2034","2035","2036","2037","2039"]);
const FREQ = {weekly:52, monthly:12, quarterly:4, yearly:1};
function moneyCalc(m){
  const out={groups:{},bills:[],ess:0,family:0,save:0,biz:0};
  BUDGET.forEach(g=>{
    const rows=[...g.lines.map((l,i)=>({code:String(+g.k+i+1),label:l})), ...(m.custom||[]).filter(c=>c.g===g.k)];
    let yr=0;
    rows.forEach(r=>{ const s=m.lines[r.code]||{}; const a=nf(s.amt)*(FREQ[s.freq||"monthly"]); yr+=a;
      if(g.k==="2000" && (s.ess ?? ESSENTIAL.has(r.code))) out.ess+=a;
      if(s.due && nf(s.amt)) out.bills.push({label:r.label,due:+s.due,amt:nf(s.amt),freq:s.freq||"monthly"}); });
    out.groups[g.k]=yr;
  });
  out.biz=out.groups["1000"]; out.family=out.groups["2000"]; out.save=out.groups["3000"];
  out.total=out.biz+out.family+out.save;
  out.bills.sort((a,b)=>a.due-b.due);
  return out;
}
PAGES.money = async v => {
  v.innerHTML = head("Private to you","My Money","Where your money goes, what your family needs, and how well it's being managed.")+`<div class="empty">Loading…</div>`;
  let m = await store.load("money") || {lines:{},custom:[]}; m.lines=m.lines||{}; m.custom=m.custom||[];
  let tab="dash", showHidden=false;
  const draw=()=>{
    v.innerHTML = head("Private to you","My Money","Where your money goes, what your family needs, and how well it's being managed.")+`
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div class="tabs" role="tablist"><button role="tab" aria-selected="${tab==="dash"}" data-t="dash">Dashboard</button><button role="tab" aria-selected="${tab==="budget"}" data-t="budget">Budget</button></div><span class="save-state" id="mSave">${P.uid?"Private to you":"Saves on this device"}</span></div>
    <div id="mBody"></div>`;
    v.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw();});
    tab==="dash"?dash():budget();
  };
  const dash=()=>{
    const r=moneyCalc(m), b=$("#mBody");
    const now=new Date(), today=now.getDate();
    b.innerHTML=`<div class="grid g3">
      ${[["1000","My Business","Cost of running the business",r.biz],["2000","Fund My Life","What home actually costs",r.family],["3000","Build My Future","Savings and wealth building",r.save]].map(([k,t,s,y])=>`<div class="card pad"><div class="eyebrow" style="color:var(--muted)">${k}</div><h3 class="st" style="margin:2px 0 6px">${t}</h3><b class="num" style="font-size:28px">${money(y)}</b><div class="note">${s} · ${money(y/12)} a month</div></div>`).join("")}
    </div>
    <div class="card pad"><h3 class="st">Your life number</h3>
      <div class="bar" aria-hidden="true">${r.total?[["biz","var(--fg)"],["family","var(--red)"],["save","var(--ok)"]].map(([k,c])=>`<i style="width:${r[k]/r.total*100}%;background:${c}"></i>`).join(""):""}</div>
      <div class="stats" style="margin-top:14px"><div class="stat card hot"><small>Total monthly cash requirement</small><b class="num">${money(r.total/12)}</b></div><div class="stat card"><small>Required annual income</small><b>${money(r.total)}</b><span class="note">before taxes</span></div></div>
      <button class="btn primary" id="toGoal" style="margin-top:14px" ${r.total?"":"disabled"}>${svg("goals",'width="16" height="16"')} Use this number in my business goal</button></div>
    <div class="card pad"><h3 class="st">Your family number</h3><div class="stats">
      <div class="stat card"><small>Bare minimum</small><b>${money(r.ess/12)}</b><span class="note">a month · keep the lights on</span></div>
      <div class="stat card"><small>Normal</small><b>${money(r.family/12)}</b><span class="note">a month · life as you live it</span></div>
      <div class="stat card"><small>Comfortable</small><b>${money((r.family+r.save)/12)}</b><span class="note">a month · life plus future</span></div></div>
      <p class="note" style="margin:10px 0 0">Bare minimum counts family lines marked with a star in the budget. Tap the star on any line to change it.</p></div>
    <div class="card"><div class="bhead"><h3 style="margin:0">Bills due this month</h3><span class="note">${now.toLocaleDateString("en-US",{month:"long",year:"numeric"})}</span></div>
      ${r.bills.length?`<div class="tw"><table><thead><tr><th>Due</th><th>Bill</th><th class="r">Amount</th></tr></thead><tbody>${r.bills.map(x=>`<tr style="${x.due<today?"color:var(--muted)":""}"><td class="num">${x.due}${x.due<today?" · paid?":""}</td><td>${esc(x.label)}</td><td class="r num">${money(x.amt)}${x.freq!=="monthly"?` <span class="note">${x.freq}</span>`:""}</td></tr>`).join("")}</tbody></table></div>`:`<div class="pad"><div class="empty">Add a due day to any budget line and it will show up here.</div></div>`}</div>`;
    $("#toGoal").onclick=async()=>{ const g=Object.assign({},GOAL_DEFAULT,await store.load("goals")||{}); g.monthly=String(Math.round(r.total/12)); store.save("goals",g,()=>{}); toast("Sent to Goals"); location.hash="goals"; };
  };
  const budget=()=>{
    const b=$("#mBody");
    b.innerHTML = BUDGET.map(g=>{
      const rows=[...g.lines.map((l,i)=>({code:String(+g.k+i+1),label:l})), ...m.custom.filter(c=>c.g===g.k)];
      return `<section class="card"><div class="bhead"><div><div class="k">${g.k} — ${g.h.toUpperCase()}</div><h3>${g.t}</h3></div><div style="text-align:right"><b class="num" style="font-size:22px" id="gt_${g.k}">$0</b><div class="note">per year</div></div></div>
      <div class="bbody">${rows.map(r=>{ const s=m.lines[r.code]||{}; if(s.hidden&&!showHidden) return ""; const ess=s.ess ?? ESSENTIAL.has(r.code);
        return `<div class="brow" data-code="${r.code}" style="${s.hidden?"opacity:.5":""}"><div class="lbl"><span class="code">${r.code}</span>${esc(r.label)}</div>
          <div class="in"><span>$</span><input id="amt_${r.code}" data-f="amt" inputmode="decimal" placeholder="0" value="${esc(s.amt||"")}" aria-label="${esc(r.label)} amount"></div>
          <select class="plain" id="fq_${r.code}" data-f="freq" aria-label="Frequency" style="padding:8px 6px">${Object.keys(FREQ).map(f=>`<option ${ (s.freq||"monthly")===f?"selected":""}>${f}</option>`).join("")}</select>
          <input class="plain" id="due_${r.code}" data-f="due" inputmode="numeric" placeholder="Due" value="${esc(s.due||"")}" aria-label="Due day of month" style="padding:8px 6px;text-align:center">
          <span class="tot" id="lt_${r.code}">${money(nf(s.amt)*FREQ[s.freq||"monthly"])}</span>
          <span class="acts">${g.k==="2000"?`<button class="iconbtn ${ess?"on":""}" data-a="ess" title="Count in bare minimum" aria-label="Count in bare minimum">${svg("star",ess?'fill="currentColor"':"")}</button>`:""}<button class="iconbtn" data-a="hide" title="${s.hidden?"Show":"Hide"} this line" aria-label="Hide this line">${svg("eye")}</button></span></div>`; }).join("")}
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn sm" data-add="${g.k}">${svg("plus",'width="14" height="14"')} Add a line</button><button class="btn sm ghost" data-show>${showHidden?"Hide unused lines":"Show hidden lines"}</button></div></div></section>`;
    }).join("") + `<div class="card pad" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:center;background:var(--ink);color:var(--ink-fg);border-color:var(--ink)"><div><div class="eyebrow" style="color:#FF8A90">Total annual cash requirement</div><b class="num" style="font-size:32px" id="gtAll">$0</b></div><div class="num" id="gtMo" style="color:var(--ink-muted)"></div></div>`;
    const totals=()=>{ const r=moneyCalc(m); BUDGET.forEach(g=>$("#gt_"+g.k).textContent=money(r.groups[g.k])); $("#gtAll").textContent=money(r.total); $("#gtMo").textContent=money(r.total/12)+" per month, before taxes"; };
    const persist=()=>store.save("money",m,savedMsg($("#mSave")));
    b.querySelectorAll(".brow").forEach(row=>{ const code=row.dataset.code;
      row.querySelectorAll("[data-f]").forEach(inp=>inp.addEventListener("input",()=>{ const s=m.lines[code]=m.lines[code]||{}; s[inp.dataset.f]=inp.value;
        $("#lt_"+code).textContent=money(nf(s.amt)*FREQ[s.freq||"monthly"]); totals(); persist(); }));
      row.querySelectorAll("[data-a]").forEach(btn=>btn.onclick=()=>{ const s=m.lines[code]=m.lines[code]||{};
        if(btn.dataset.a==="ess"){ s.ess=!(s.ess ?? ESSENTIAL.has(code)); } else { s.hidden=!s.hidden; } persist(); budget(); }); });
    b.querySelectorAll("[data-add]").forEach(btn=>btn.onclick=()=>{ const g=btn.dataset.add; const n=m.custom.filter(c=>c.g===g).length;
      const box=document.createElement("div"); box.style.cssText="display:flex;gap:8px;width:100%;margin-top:8px"; box.innerHTML=`<input class="plain" id="newLine_${g}" placeholder="Line name" style="flex:1"><button class="btn sm primary">Add</button>`; btn.parentElement.after(box);
      const inp=box.querySelector("input"); inp.focus(); box.querySelector("button").onclick=()=>{ if(!inp.value.trim())return; m.custom.push({g,code:String(+g+90+n),label:inp.value.trim()}); persist(); budget(); }; });
    b.querySelectorAll("[data-show]").forEach(btn=>btn.onclick=()=>{showHidden=!showHidden;budget();});
    totals();
  };
  draw();
};

/* ---------------- DEAL ANALYZER ---------------- */
const EXP = [["taxes","Property taxes"],["insurance","Insurance"],["electric","Electric",1],["water","Water",1],["sewer","Sewer",1],["gas","Gas",1],["oil","Oil",1],["hoa","HOA / condo fees"],["lawn","Lawn service"],["repairs","Repairs & maintenance"],["capex","CapEx reserves"],["mgmt","Property management"],["misc","Miscellaneous"]];
const OTHER = [["commercial","Commercial / shop"],["parking","Parking"],["laundry","Laundry"],["miscInc","Miscellaneous"]];
function newDeal(example){
  const base={id:"d"+Date.now().toString(36), name:"New property", type:"Single family", units:[""], price:"", value:"", arv:"", rehab:"", closing:"", otherAcq:"", sqft:"", notes:"",
    other:{}, otherCounts:{}, vacancy:"5", exp:{}, util:{}, fin:{down:"20", rate:"7.5", term:"30", io:false, fees:""}, minDscr:"1.0", updated:Date.now()};
  if(example) Object.assign(base,{name:"123 Main Street (example)", type:"Duplex", units:["1750","1750"], price:"240000", value:"240000", arv:"275000", closing:"15000", other:{miscInc:"200"}, vacancy:"0",
    exp:{taxes:{v:"475",per:"mo"},insurance:{v:"125",per:"mo"},repairs:{v:"300",per:"mo"},capex:{v:"150",per:"mo"},mgmt:{v:"150",per:"mo"}}, fin:{down:"15",rate:"7.5",term:"30",io:false,fees:""}, minDscr:"0.75", example:true});
  return base;
}
function dealCalc(d,over={}){
  const rentAdj=over.rentAdj??1, rateAdd=over.rateAdd??0, vacAdd=over.vacAdd??0, expAdj=over.expAdj??1;
  const price=over.price??nf(d.price);
  const rents=d.units.reduce((s,u)=>s+nf(u),0)*rentAdj;
  const otherInc=OTHER.reduce((s,[k])=>s+nf(d.other[k]),0);
  const qualOther=OTHER.reduce((s,[k])=>s+(d.otherCounts[k]?nf(d.other[k]):0),0);
  const gross=rents+otherInc, qualRent=rents+qualOther;
  const vac=rents*(nf(d.vacancy)+vacAdd)/100;
  const line=k=>{ const e=d.exp[k]; if(!e) return 0; return nf(e.v)/(e.per==="yr"?12:1); };
  let opex=vac; EXP.forEach(([k,,u])=>{ if(u && d.util[k]==="tenant") return; opex+=line(k)*(k==="taxes"||k==="insurance"||k==="hoa"?1:expAdj); });
  const noi=gross-opex;
  const down=price*nf(d.fin.down)/100, loan=price-down;
  const rate=nf(d.fin.rate)+rateAdd, r=rate/1200, n=Math.max(1,nf(d.fin.term))*12;
  const pi = loan<=0?0 : d.fin.io ? loan*r : (r===0? loan/n : loan*r/(1-Math.pow(1+r,-n)));
  const pitia=pi+line("taxes")+line("insurance")+line("hoa");
  const cf=noi-pi, cash=down+nf(d.closing)+nf(d.rehab)+nf(d.otherAcq)+nf(d.fin.fees);
  return {price,rents,otherInc,gross,qualRent,vac,opex,noi,down,loan,pi,pitia,cf,cash,
    coc: cash>0? cf*12/cash : NaN, cap: price>0? noi*12/price : NaN, dscr: pitia>0? qualRent/pitia : NaN,
    grm: gross>0? price/(gross*12):NaN, ltv: price>0? loan/price:NaN, breakeven: gross>0?(opex-vac+pi)/gross:NaN,
    zeroRent: opex-vac+pi-otherInc, minQual: pitia*nf(d.minDscr||1)};
}
PAGES.deals = async v => {

  let cur=null, tab="analyze";
  const persist=()=>store.save("deals",S,savedMsg($("#dSave")));
  const list=()=>{
    v.innerHTML = head("Investor tools","Deal Analyzer","Analyze rental income, financing, cash flow and returns in one place.")+`
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="btn primary" id="dNew">${svg("plus",'width="16" height="16"')} New analysis</button>${S.list.length?"":`<button class="btn" id="dEx">Load the example</button>`}<span class="save-state" id="dSave" style="margin-left:auto">${P.uid?"Private to you":"Saves on this device"}</span></div>

      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px"><div><div class="note">RENT</div><b class="num">${money(c.gross)}</b></div><div><div class="note">CASH FLOW</div><b class="num" style="color:${c.cf>=0?"var(--ok)":"var(--bad)"}">${money(c.cf)}</b></div><div><div class="note">COC</div><b class="num">${pct(c.coc)}</b></div></div>

      :`<div class="empty">No analyses yet. Start a new one, or load the 123 Main Street example to see how it works.</div>`}</section>`;
    $("#dNew").onclick=()=>{ const d=newDeal(false); S.list.push(d); persist(); cur=d; tab="analyze"; editor(); };
    const ex=$("#dEx"); if(ex) ex.onclick=()=>{ const d=newDeal(true); S.list.push(d); persist(); cur=d; tab="analyze"; editor(); };

  };
  const touch=()=>{ cur.updated=Date.now(); persist(); };

  const compare=()=>{
    const rows=[["Price",c=>money(c.price)],["Gross rent / mo",c=>money(c.gross)],["Expenses / mo",c=>money(c.opex)],["NOI / mo",c=>money(c.noi)],["Mortgage / mo",c=>money(c.pi)],["Cash flow / mo",c=>money(c.cf)],["Cash required",c=>money(c.cash)],["Cash-on-cash",c=>pct(c.coc)],["Cap rate",c=>pct(c.cap)],["DSCR",c=>isFinite(c.dscr)?c.dscr.toFixed(2):"—"]];

    $("#dBody").innerHTML=`<div class="card"><div class="tw"><table><thead><tr><th>Scenario</th><th class="r">Cash flow / mo</th><th class="r">Cash-on-cash</th><th class="r">DSCR</th><th>Status</th></tr></thead><tbody>${sc.map(([l,o])=>{ const c=dealCalc(cur,o); const ok=c.cf>=0&&c.dscr>=nf(cur.minDscr||1); return `<tr><td>${l}</td><td class="r num" style="color:${c.cf>=0?"var(--ok)":"var(--bad)"}">${money(c.cf)}</td><td class="r num">${pct(c.coc)}</td><td class="r num">${isFinite(c.dscr)?c.dscr.toFixed(2):"—"}</td><td><span class="pill" style="${ok?"background:var(--ok-soft);color:var(--ok)":"background:var(--warn-soft);color:var(--warn)"}">${ok?"Holds":"At risk"}</span></td></tr>`; }).join("")}</tbody></table></div></div>
    <p class="note">“Holds” means cash flow stays positive and DSCR stays at or above the lender minimum.</p>`;

  const maxPrice=()=>{
    const b=$("#dBody"); cur.max=cur.max||{metric:"coc",target:"10"};

    b.innerHTML=`<div class="card pad"><h3 class="st">Find the highest price that still hits your target</h3><div class="fields">

    $("#mx_m").value=cur.max.metric;

    const b=$("#dBody"); cur.br=cur.br||{ltv:"75",rate:cur.fin.rate||"7.5",term:"30",costs:""};

      const newLoan=arv*nf(br.ltv)/100, payoff=c.loan, cashOut=newLoan-payoff-nf(br.costs), left=c.cash-cashOut;
      const r=nf(br.rate)/1200, n=nf(br.term)*12, pi=newLoan<=0?0:(r===0?newLoan/n:newLoan*r/(1-Math.pow(1+r,-n)));
      const cf=c.noi-pi;
      $("#brOut").innerHTML = !arv?`<div class="empty">Add the after repair value (ARV) in Analyze to run the BRRRR refinance.</div>`:`<div class="stats">
        <div class="stat card"><small>Refi loan</small><b>${money(newLoan)}</b></div><div class="stat card"><small>Pays off</small><b>${money(payoff)}</b></div><div class="stat card"><small>Cash back at refi</small><b>${money(cashOut)}</b></div>
        <div class="stat card hot"><small>Cash left in deal</small><b class="num">${money(Math.max(0,left))}</b></div><div class="stat card"><small>New cash flow / mo</small><b style="color:${cf>=0?"var(--ok)":"var(--bad)"}">${money(cf)}</b></div>
        <div class="stat card"><small>Return on cash left</small><b>${left<=0?"Infinite":pct(cf*12/left)}</b></div></div>`; };
    b.innerHTML=`<div class="card pad"><h3 class="st">Buy, rehab, rent, refinance, repeat</h3><div class="fields">
      ${F("br_ltv","Refi LTV",cur.br.ltv,"","%")}${F("br_rate","Refi rate",cur.br.rate,"","%")}${F("br_term","Refi term",cur.br.term,"","yrs")}${F("br_costs","Refi closing costs",cur.br.costs)}</div>

    [["ltv"],["rate"],["term"],["costs"]].forEach(([k])=>$("#br_"+k).addEventListener("input",e=>{cur.br[k]=e.target.value; touch(); draw();}));
    draw();
  };
  list();
};

let PDFJS_READY=null;
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("load")); document.head.appendChild(s); }); }
function pdfjs(){
  if(!PDFJS_READY) PDFJS_READY = loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js")
    .then(()=>loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"))
    .then(()=>window.pdfjsLib).catch(e=>{ PDFJS_READY=null; throw e; });
  return PDFJS_READY;
}
const slug = s => String(s||"document").replace(/\s*\([^)]*\)\s*/g," ").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,80)||"document";
let DOC_CLOSE=null;
async function openDoc(url,name){
  if(DOC_CLOSE) DOC_CLOSE();
  const ov=document.createElement("div"); ov.className="docv"; ov.setAttribute("role","dialog"); ov.setAttribute("aria-modal","true"); ov.setAttribute("aria-label",name);
  ov.innerHTML=`<div class="docv-bar"><b class="docv-t">${esc(name)}</b><span class="docv-n" id="docvN"></span><button class="btn sm primary" id="docvDl" disabled>Download</button><button class="btn sm" id="docvX" aria-label="Close">Close</button></div><div class="docv-body" id="docvBody"><div class="docv-msg">Opening…</div></div>`;
  document.body.appendChild(ov); document.body.style.overflow="hidden";
  let alive=true, blob=null, ext="pdf";
  const close=()=>{ alive=false; ov.remove(); document.body.style.overflow=""; document.removeEventListener("keydown",onKey); DOC_CLOSE=null; };
  const onKey=e=>{ if(e.key==="Escape") close(); };
  DOC_CLOSE=close; document.addEventListener("keydown",onKey); $("#docvX").onclick=close; $("#docvX").focus();
  const body=$("#docvBody");
  try{
    const r=await fetch(url); if(!r.ok) throw new Error("http");
    blob=await r.blob(); if(!alive) return;
    const ct=(r.headers.get("content-type")||blob.type||"").toLowerCase();
    ext = ct.includes("pdf")?"pdf":ct.includes("svg")?"svg":ct.includes("png")?"png":ct.includes("jpeg")||ct.includes("jpg")?"jpg":ct.includes("webp")?"webp":"pdf";
    const dlBtn=$("#docvDl"); dlBtn.disabled=false;
    dlBtn.onclick=async()=>{
      const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=slug(name)+"."+ext; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);
    };
    if(ext!=="pdf"){
      body.innerHTML=`<div class="docv-img"><img alt="${esc(name)}" src="${URL.createObjectURL(blob)}"></div>`; return;
    }
    const lib=await pdfjs(); if(!alive) return;
    const doc=await lib.getDocument({data:new Uint8Array(await blob.arrayBuffer())}).promise; if(!alive) return;
    $("#docvN").textContent=`${doc.numPages} page${doc.numPages>1?"s":""}`;
    body.innerHTML="";
    const w=Math.min(body.clientWidth-32,900), dpr=Math.min(window.devicePixelRatio||1,2);
    for(let i=1;i<=doc.numPages && alive;i++){
      const page=await doc.getPage(i); const vp0=page.getViewport({scale:1}); const sc=w/vp0.width; const vp=page.getViewport({scale:sc*dpr});
      const c=document.createElement("canvas"); c.width=vp.width; c.height=vp.height; c.style.width=(vp.width/dpr)+"px"; c.className="docv-page"; c.setAttribute("aria-label",`Page ${i}`);
      body.appendChild(c); await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
    }
  }catch(e){
    if(alive) body.innerHTML=`<div class="docv-msg">This file couldn't be shown here.${blob?" Use Download to save it and open it on your computer.":" Refresh the hub and try again."}</div>`;
  }
}
document.addEventListener("click",e=>{
  const a=e.target.closest('a[href^="files/"]'); if(!a) return;
  e.preventDefault();
  const name=a.dataset.name || a.querySelector(".t")?.textContent || a.textContent.trim() || "Document";
  openDoc(a.getAttribute("href"), name.trim());
});

window.addEventListener("hashchange",()=>{ if(typeof DOC_CLOSE==="function") DOC_CLOSE(); });
/* ---------- start ---------- */
route();
boot();
</script>

</html>
